name: Rotina Rapida - Conta Corrente

on:
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Rodar ETL apenas de CC e CP
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SUPABASE_URL_ESPELHO: ${{ secrets.SUPABASE_URL_ESPELHO }}
        SUPABASE_KEY_ESPELHO: ${{ secrets.SUPABASE_KEY_ESPELHO }}
        OMIE_CREDENCIAIS: ${{ secrets.OMIE_CREDENCIAIS }}
      run: |
        python -u conta_corrente_rapida_etl.py
        python -u contas_pagar_etl.py
