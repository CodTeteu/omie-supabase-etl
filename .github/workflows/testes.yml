name: Testes

# Roda a cada push. Nao usa secrets nem banco: as respostas do Supabase sao
# simuladas. Garante que a gravacao continua falhando de forma visivel.

on:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Checando o código do repositório
        uses: actions/checkout@v3

      - name: Configurando o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalando dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodando os testes
        run: python -m unittest discover -s tests -v
