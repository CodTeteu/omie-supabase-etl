name: Testes

# Roda a cada push. Nao usa secrets: as respostas HTTP sao simuladas e o SQL
# usa PostgreSQL local com dados sinteticos. Nunca conecta aos bancos reais.

on:
  push:
    branches: [main, 'codex/**']

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_DB: omie_replicas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture_password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d omie_replicas_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:fixture_password@127.0.0.1:5432/omie_replicas_test

    steps:
      - name: Checando o código do repositório
        uses: actions/checkout@v5

      - name: Configurando o Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Instalando dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'psycopg[binary]==3.3.8'

      - name: Rodando os testes
        run: python -m unittest discover -s tests -v
