name: Rotina Rapida - Categorias

on:
  # Manual. Toda noite ja roda dentro da Rotina Noturna Omie ETL, as 22h.
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Sincronizar Categorias
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SUPABASE_URL_ESPELHO: ${{ secrets.SUPABASE_URL_ESPELHO }}
        SUPABASE_KEY_ESPELHO: ${{ secrets.SUPABASE_KEY_ESPELHO }}
        OMIE_CREDENCIAIS: ${{ secrets.OMIE_CREDENCIAIS }}
      run: |
        python -u sync_categorias.py
