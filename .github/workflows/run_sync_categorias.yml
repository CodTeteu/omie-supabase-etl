name: Rotina Rapida - Categorias

on:
  # Manual. Todo dia ja roda dentro da Rotina Noturna Omie ETL, a meia-noite.
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Sincronizar Categorias
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        OMIE_CREDENCIAIS: ${{ secrets.OMIE_CREDENCIAIS }}
      run: |
        python -u sync_categorias.py
