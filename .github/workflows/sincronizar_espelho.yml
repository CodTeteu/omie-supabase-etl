name: Sincronizar Espelho (banco da Audit)

# Reconciliacao por chave e conteudo como recuperacao de cargas parciais.

on:
  workflow_dispatch:
    inputs:
      tabelas:
        description: "Tabelas separadas por espaco (vazio = todas)"
        type: string
        default: ""

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    # Nao roda junto com a rotina noturna, que grava nas mesmas tabelas.
    concurrency:
      group: rotina-omie
      cancel-in-progress: false

    steps:
      - name: Checando o código do repositório
        uses: actions/checkout@v5

      - name: Configurando o Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Instalando dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reconciliando o principal com o espelho
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_URL_ESPELHO: ${{ secrets.SUPABASE_URL_ESPELHO }}
          SUPABASE_KEY_ESPELHO: ${{ secrets.SUPABASE_KEY_ESPELHO }}
          TABELAS_OMIE: ${{ inputs.tabelas }}
        run: |
          read -r -a tabelas <<< "$TABELAS_OMIE"
          python -u sincronizar_espelho.py "${tabelas[@]}"
