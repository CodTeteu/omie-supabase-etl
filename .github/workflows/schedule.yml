name: Rotina Noturna Omie ETL

on:
  schedule:
    # ATENCAO: o cron do GitHub Actions e SEMPRE em UTC. O Brasil e UTC-3
    # (sem horario de verao desde 2019): subtraia 3h para Brasilia.
    #
    # A carga comeca as 22:00 (Brasilia), disparada pelo agendador do Supabase
    # da Audit pela API do GitHub (ver agendador_supabase.sql): disparo por API
    # comeca em segundos. Os horarios abaixo sao RESERVA: o GitHub atrasa os
    # agendamentos em horas (em 05 e 06/10/2026 o das 00:07 so chegou as 07:17
    # e as 07:05) e, sob carga, pode descarta-los sem aviso. Cada disparo comeca
    # pelo job "decidir": se a carga desta noite ja foi feita ou outra execucao
    # esta rodando, encerra em segundos; se o agendador falhou, a reserva faz a
    # carga e deixa um aviso.
    - cron: '7 1 * * *'    # 22:07 em Brasilia - reserva do agendador das 22:00
    - cron: '7 5 * * *'    # 02:07 em Brasilia - reserva
    - cron: '7 9 * * *'    # 06:07 em Brasilia - reserva

  workflow_dispatch: # Permite rodar manualmente clicando em um botão no Github
    inputs:
      somente_manutencao:
        description: "Só testar o commit de manutenção (não roda a carga)"
        type: boolean
        default: false
      agendador:
        description: "Disparo do agendador do Supabase (segue as regras da noite: não repete a carga)"
        type: boolean
        default: false

jobs:
  manter-ativa:
    # O GitHub desativa workflows agendados apos 60 dias sem commits em
    # repositorio publico. Esta automacao roda sozinha, sem ninguem mexer no
    # codigo - entao, sem isto, a rotina pararia em silencio (nada roda, nada
    # alerta) e uma semana depois o Supabase pausaria o banco por inatividade.
    # Se o ultimo commit tiver 45 dias ou mais, faz um commit vazio.
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checando o código do repositório
        uses: actions/checkout@v5

      - name: Mantendo o agendamento ativo
        run: |
          dias=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Ultimo commit ha $dias dia(s)."
          if [ "$dias" -ge 45 ] || [ "${{ inputs.somente_manutencao }}" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Manutencao automatica: mantem a rotina agendada ativa ($dias dias sem commit)"
            git push origin HEAD:main
            echo "Commit de manutencao enviado."
          else
            echo "Nada a fazer: o GitHub so desativa apos 60 dias sem commit."
          fi

  decidir:
    # Roda a carga se o disparo for manual, ou se a carga desta noite (desde as
    # 20:00 de Brasilia) ainda nao foi feita e nao ha execucao anterior em
    # andamento. Ver decidir_execucao.py.
    if: ${{ !inputs.somente_manutencao }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      rodar: ${{ steps.decisao.outputs.rodar }}

    steps:
      - name: Checando o código do repositório
        uses: actions/checkout@v5

      - name: Decidindo se a carga roda neste disparo
        id: decisao
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          DISPARO: ${{ github.event.schedule }}
          AGENDADOR: ${{ inputs.agendador }}
        run: python3 decidir_execucao.py

  run-etl:
    needs: decidir
    if: ${{ needs.decidir.outputs.rodar == 'true' }}
    runs-on: ubuntu-latest

    # Duas execucoes ao mesmo tempo apagariam e regravariam as mesmas tabelas em
    # paralelo. Se uma for disparada enquanto outra roda, ela espera na fila.
    concurrency:
      group: rotina-omie
      cancel-in-progress: false

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_URL_ESPELHO: ${{ secrets.SUPABASE_URL_ESPELHO }}
      SUPABASE_KEY_ESPELHO: ${{ secrets.SUPABASE_KEY_ESPELHO }}
      OMIE_CREDENCIAIS: ${{ secrets.OMIE_CREDENCIAIS }}

    # Atualiza TUDO todo dia: os 3 cadastros e as 4 tabelas principais.
    #
    # Qualquer gravacao que falhe deixa a execucao VERMELHA e o GitHub avisa
    # por email. Antes, os erros eram so impressos no log: de 16/09 a
    # 04/10/2026 o banco nao existia e todas as execucoes ficaram verdes.
    #
    # Cada passo roda mesmo que um anterior falhe (um problema numa tabela nao
    # impede as outras), mas so se o banco responder no inicio.

    steps:
      - name: Checando o código do repositório
        uses: actions/checkout@v5

      - name: Configurando o Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Instalando dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Checando se o banco responde
        id: banco
        run: python checar_saude.py --antes

      # Cadastros primeiro: as views cruzam os titulos com eles.
      - name: Sincronizando Categorias
        if: ${{ !cancelled() && steps.banco.outcome == 'success' }}
        run: python sync_categorias.py

      - name: Sincronizando Departamentos
        if: ${{ !cancelled() && steps.banco.outcome == 'success' }}
        run: python sync_departamentos.py

      - name: Sincronizando Clientes
        if: ${{ !cancelled() && steps.banco.outcome == 'success' }}
        run: python sync_clientes.py

      - name: Executando o Script de Contas a Receber
        if: ${{ !cancelled() && steps.banco.outcome == 'success' }}
        run: python contas_receber_etl.py

      - name: Executando o Script de Conta Corrente
        if: ${{ !cancelled() && steps.banco.outcome == 'success' }}
        run: python conta_corrente_etl.py

      - name: Executando o Script de Movimentos Financeiros
        if: ${{ !cancelled() && steps.banco.outcome == 'success' }}
        run: python movimentos_financeiros_etl.py

      - name: Executando o Script de Contas a Pagar
        if: ${{ !cancelled() && steps.banco.outcome == 'success' }}
        run: python contas_pagar_etl.py

      - name: Conferindo os dados gravados
        if: ${{ !cancelled() && steps.banco.outcome == 'success' }}
        env:
          # banco das aprovacoes do BI de Repasse: uma consulta por noite para o Supabase
          # (plano gratuito) nao pausar o projeto por falta de uso
          APROVACOES_URL: ${{ secrets.APROVACOES_URL }}
          APROVACOES_KEY: ${{ secrets.APROVACOES_KEY }}
        run: python checar_saude.py
