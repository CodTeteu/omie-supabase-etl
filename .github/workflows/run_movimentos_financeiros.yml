name: Rotina Rapida - Movimentos Financeiros

on:
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Rodar ETL apenas de Movimentos Financeiros
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SUPABASE_URL_ESPELHO: ${{ secrets.SUPABASE_URL_ESPELHO }}
        SUPABASE_KEY_ESPELHO: ${{ secrets.SUPABASE_KEY_ESPELHO }}
        OMIE_CREDENCIAIS: ${{ secrets.OMIE_CREDENCIAIS }}
      run: |
        python -u movimentos_financeiros_rapida_etl.py
