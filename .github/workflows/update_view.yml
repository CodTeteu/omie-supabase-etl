name: Atualizar View SQL no Supabase

on:
  workflow_dispatch:

jobs:
  update-view:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Rodar update_view.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OMIE_CREDENCIAIS: ${{ secrets.OMIE_CREDENCIAIS }}
        run: python update_view.py
